<!DOCTYPE html>
<html>
<head>
    <title>Test Check Paket API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .result { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .success { border-left: 5px solid #4CAF50; }
        .error { border-left: 5px solid #f44336; }
        button { background: #2196F3; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
        button:hover { background: #1976D2; }
        pre { background: #333; color: #fff; padding: 15px; border-radius: 5px; overflow-x: auto; }
        input { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Check Paket API (Updated)</h1>
        <p>API telah diperbaiki untuk hanya membutuhkan <code>id_user</code> tanpa <code>id_kelas</code></p>
        
        <div>
            <label>User ID:</label>
            <input type="number" id="userId" value="1" min="1">
            <button onclick="testCheckPaket()">Test Check Paket</button>
            <button onclick="testInvalidUser()">Test Invalid User</button>
            <button onclick="testMissingParam()">Test Missing Parameter</button>
        </div>

        <div id="results"></div>
    </div>

    <script>
        async function testCheckPaket() {
            const userId = document.getElementById('userId').value;
            showResult('Testing Check Paket API...', 'info');
            
            try {
                const response = await fetch('http://127.0.0.1:8000/api/check-paket', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        id_user: parseInt(userId)
                    })
                });
                
                const data = await response.json();
                
                if (data.status) {
                    let resultHtml = `
                        <h3>✅ SUCCESS</h3>
                        <p><strong>Message:</strong> ${data.message}</p>
                        <p><strong>User ID:</strong> ${data.data.user_id}</p>
                        <p><strong>Total Active Packages:</strong> ${data.data.total_active_packages}</p>
                    `;
                    
                    if (data.data.packages && data.data.packages.length > 0) {
                        resultHtml += '<h4>📦 Active Packages:</h4><ul>';
                        data.data.packages.forEach((pkg, index) => {
                            resultHtml += `
                                <li>
                                    <strong>${pkg.paket_name}</strong><br>
                                    - ID: ${pkg.paket_id}<br>
                                    - Expires: ${pkg.expired_date}<br>
                                    - Days Left: ${pkg.remaining_days}<br>
                                    - Status: ${pkg.status}
                                </li>
                            `;
                        });
                        resultHtml += '</ul>';
                    }
                    
                    showResult(resultHtml, 'success');
                } else {
                    showResult(`❌ FAILED: ${data.message}`, 'error');
                }
                
                showResult(`<pre>${JSON.stringify(data, null, 2)}</pre>`, 'info');
                
            } catch (error) {
                showResult(`❌ Network Error: ${error.message}`, 'error');
            }
        }
        
        async function testInvalidUser() {
            showResult('Testing dengan User ID yang tidak ada...', 'info');
            
            try {
                const response = await fetch('http://127.0.0.1:8000/api/check-paket', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        id_user: 999999
                    })
                });
                
                const data = await response.json();
                showResult(`Status: ${response.status} - ${data.message}`, data.status ? 'success' : 'error');
                showResult(`<pre>${JSON.stringify(data, null, 2)}</pre>`, 'info');
                
            } catch (error) {
                showResult(`❌ Network Error: ${error.message}`, 'error');
            }
        }
        
        async function testMissingParam() {
            showResult('Testing tanpa parameter id_user...', 'info');
            
            try {
                const response = await fetch('http://127.0.0.1:8000/api/check-paket', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({})
                });
                
                const data = await response.json();
                showResult(`Status: ${response.status} - ${data.message}`, 'error');
                if (data.errors) {
                    showResult(`Validation Errors: ${JSON.stringify(data.errors)}`, 'error');
                }
                showResult(`<pre>${JSON.stringify(data, null, 2)}</pre>`, 'info');
                
            } catch (error) {
                showResult(`❌ Network Error: ${error.message}`, 'error');
            }
        }
        
        function showResult(message, type) {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `result ${type}`;
            resultDiv.innerHTML = message;
            resultsDiv.appendChild(resultDiv);
            resultsDiv.scrollTop = resultsDiv.scrollHeight;
        }
        
        // Clear results
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        // Auto test when page loads
        window.onload = function() {
            testCheckPaket();
        };
    </script>
</body>
</html>
